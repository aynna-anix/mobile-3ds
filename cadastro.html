
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Clientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f2;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        h1, h2 {
            color: #276749;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #276749;
            color: white;
            padding: 10px 14px;
            margin: 12px 5px 5px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1c5037;
        }

        .cliente {
            background: #f1f5f2;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cliente:hover {
            background: #dceee0;
        }

        #mensagem {
            font-weight: bold;
            margin-top: 15px;
        }

        hr {
            margin-top: 25px;
            border: 0;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Cadastro de Clientes</h1>

    <form id="formCliente">
        <label for="id">Código do cliente (ID)</label>
        <input type="text" id="id" placeholder="Gerado automaticamente" readonly>

        <label for="nome">Nome</label>
        <input type="text" id="nome" required placeholder="Digite o nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="Digite o e-mail">

        <button type="submit">Cadastrar cliente</button>
        <button type="button" onclick="limpar_formulario()">Limpar campos</button>
    </form>

    <hr>

    <h2>Buscar cliente</h2>

    <input type="text" id="busca" placeholder="Digite o nome ou ID">

    <button onclick="buscar_cliente()">Buscar</button>
    <button onclick="listar_clientes()">Listar todos</button>

    <div id="resultados"></div>

    <hr>

    <h2>Clientes cadastrados</h2>

    <p>Total de clientes: <strong id="total">0</strong></p>

    <div id="listaClientes"></div>

    <button onclick="cadastrar_clientes()">Cadastrar vários</button>
    <button onclick="salvar_cliente()">Salvar clientes.json</button>

    <p id="mensagem"></p>

</div>

<script>
    // Limpa a lista em memória no início do programa.
    let clientes = [];
    let proximoId = 1;

    // Classe Cliente.
    class Cliente {
        constructor(id, nome, email) {
            this.id = id;
            this.nome = nome;
            this.email = email;
        }

        toJSON() {
            return {
                id: this.id,
                nome: this.nome,
                email: this.email
            };
        }
    }

    // Inclui um novo cliente.
    function incluir_cliente(nome, email) {
        nome = nome.trim();
        email = email.trim();

        if (!nome || !email) {
            alert("Preencha todos os campos!");
            return null;
        }

        const cliente = new Cliente(proximoId++, nome, email);

        clientes.push(cliente);

        listar_clientes();

        document.getElementById("mensagem").textContent =
            "Cliente cadastrado com sucesso!";

        return cliente;
    }

    // Salva e baixa os dados em formato JSON.
    function salvar_cliente() {
        const dados = JSON.stringify(clientes, null, 4);

        const arquivo = new Blob(
            [dados],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(arquivo);
        const link = document.createElement("a");

        link.href = url;
        link.download = "clientes.json";
        link.click();

        URL.revokeObjectURL(url);

        document.getElementById("mensagem").textContent =
            "Arquivo clientes.json gerado!";
    }

    // Solicita os dados para cadastrar vários clientes.
    function cadastrar_clientes() {
        while (true) {
            const nome = prompt("Digite o nome do cliente:");

            if (nome === null) break;

            const email = prompt("Digite o e-mail do cliente:");

            if (email === null) break;

            incluir_cliente(nome, email);

            if (!confirm("Deseja cadastrar outro cliente?")) break;
        }
    }

    // Exibe todos os clientes.
    function listar_clientes() {
        const lista = document.getElementById("listaClientes");
        lista.replaceChildren();

        document.getElementById("total").textContent = clientes.length;

        clientes.forEach(cliente => {
            const item = document.createElement("div");

            item.className = "cliente";
            item.textContent =
                `ID: ${cliente.id} | Nome: ${cliente.nome} | E-mail: ${cliente.email}`;

            item.onclick = () => selecionar_cliente(cliente.id);

            lista.appendChild(item);
        });
    }

    // Busca por nome ou ID.
    function buscar_cliente() {
        const termo = document.getElementById("busca")
            .value.trim().toLowerCase();

        const resultados = document.getElementById("resultados");
        resultados.replaceChildren();

        if (!termo) {
            alert("Digite um nome ou ID para buscar.");
            return;
        }

        const encontrados = clientes.filter(cliente =>
            cliente.nome.toLowerCase().includes(termo) ||
            String(cliente.id) === termo
        );

        if (encontrados.length === 0) {
            resultados.textContent = "Nenhum cliente encontrado.";
            return;
        }

        encontrados.forEach(cliente => {
            const item = document.createElement("div");

            item.className = "cliente";
            item.textContent =
                `ID: ${cliente.id} | Nome: ${cliente.nome} | E-mail: ${cliente.email}`;

            item.onclick = () => selecionar_cliente(cliente.id);

            resultados.appendChild(item);
        });
    }

    // Preenche automaticamente os campos ao selecionar um cliente.
    function selecionar_cliente(id) {
        const cliente = clientes.find(c => c.id === Number(id));

        if (!cliente) return;

        document.getElementById("id").value = cliente.id;
        document.getElementById("nome").value = cliente.nome;
        document.getElementById("email").value = cliente.email;

        document.getElementById("mensagem").textContent =
            "Cliente selecionado!";
    }

    // Limpa os campos do formulário.
    function limpar_formulario() {
        document.getElementById("formCliente").reset();
        document.getElementById("id").value = "";
        document.getElementById("mensagem").textContent = "";
    }

    // Evento de cadastro pelo formulário.
    document.getElementById("formCliente").addEventListener("submit", function(evento) {
        evento.preventDefault();

        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;

        const cliente = incluir_cliente(nome, email);

        if (cliente) {
            limpar_formulario();
        }
    });

    // Exibe a lista vazia ao iniciar.
    listar_clientes();
</script>

</body>
</html>
